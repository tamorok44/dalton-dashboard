<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="730" viewBox="0 0 1600 730" role="img" aria-label="Die Dalton-Main-Street im sonnigen Western-Grenzland: Saloon, Wasserturm, Telegrafenmast und Canyon">
<defs>
<linearGradient id="day" x1="0" y1="0" x2=".18" y2="1"><stop stop-color="#8acddc"/><stop offset=".4" stop-color="#c4ded6"/><stop offset=".78" stop-color="#f3d3a6"/><stop offset="1" stop-color="#dba880"/></linearGradient>
<radialGradient id="sunMist"><stop stop-color="#fff7d8" stop-opacity=".85"/><stop offset=".34" stop-color="#fae4b6" stop-opacity=".40"/><stop offset="1" stop-color="#f9e0ad" stop-opacity="0"/></radialGradient>
<linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bd9580"/><stop offset="1" stop-color="#8c8881"/></linearGradient>
<linearGradient id="prairie" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c29d7e"/><stop offset="1" stop-color="#7a7368"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#e7ca9f"/><stop offset=".62" stop-color="#d5b088"/><stop offset="1" stop-color="#b79070"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7a17d"/><stop offset=".48" stop-color="#9b7659"/><stop offset="1" stop-color="#715849"/></linearGradient>
<linearGradient id="tower" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d0ad85"/><stop offset=".5" stop-color="#a67d5d"/><stop offset="1" stop-color="#7b5c49"/></linearGradient>
<linearGradient id="dust" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#efd9b6" stop-opacity=".05"/><stop offset="1" stop-color="#d3b998" stop-opacity=".44"/></linearGradient>
</defs>
<rect width="1600" height="730" fill="url(#day)"/>
<ellipse cx="1168" cy="174" rx="300" ry="265" fill="url(#sunMist)"/><circle cx="1168" cy="174" r="52" fill="#fff4ce" opacity=".75"/>
