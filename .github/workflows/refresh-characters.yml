name: Dalton-Profile automatisch aktualisieren

on:
  schedule:
    # Twice hourly, away from minute :00 to reduce GitHub schedule congestion.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dalton-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Aufruf der Live-Aktualisierung ohne Deployment
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 8 --max-time 100 \
            --header 'Cache-Control: no-cache' \
            'https://dalton-dashboard-eight.vercel.app/api/refresh' \
            --output /dev/null
