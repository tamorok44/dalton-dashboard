name: Dalton-Profile alle 30 Minuten abrufen
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Gespeicherte Profile serverseitig aktualisieren
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_URL" && test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 100 \
            -X POST "${DASHBOARD_URL%/}/api/refresh" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -o /dev/null
