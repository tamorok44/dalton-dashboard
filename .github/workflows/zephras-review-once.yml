name: Einmaliger Effekt- und Rangabgleich
on:
  push:
    branches: [talent-zephras-review-20261126]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: talent-evidence-capture-20261126
          run-id: 45813547795
          github-token: ${{ github.token }}
          path: evidence-capture/
      - uses: actions/download-artifact@v4
        with:
          name: zephras-exact-review
          run-id: 45816214866
          github-token: ${{ github.token }}
          path: evidence-capture/
      - run: python scripts/zephras-effect-review.py
      - uses: actions/upload-artifact@v4
        with:
          name: zephras-effect-review
          path: evidence-capture/effect-review.json
          retention-days: 14
