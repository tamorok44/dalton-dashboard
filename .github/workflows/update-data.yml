name: Dalton-Daten aktualisieren
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/official-scrape.mjs"
      - "scripts/armory-core.mjs"
      - "scripts/test-armory.mjs"
      - "scripts/test-ui.mjs"
      - "app.js"
      - "styles.css"
      - ".github/workflows/update-data.yml"
permissions:
  contents: write
concurrency:
  group: dalton-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prüfen, ob deutsche Ausrüstung korrekt erkannt wird
        run: npm test
      - name: Blizzard-Profile, Werte, Talente und Bilder abrufen
        run: node scripts/official-scrape.mjs
      - name: Änderungen sicher speichern
        run: |
          git config user.name "dalton-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/characters.json
          if git diff --cached --quiet; then
            echo "Keine Datenänderung"
            exit 0
          fi
          git commit -m "Blizzard-Charakterdaten automatisch aktualisieren"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Daten erfolgreich veröffentlicht"
              exit 0
            fi
            sleep 2
          done
          echo "Push nach drei Versuchen fehlgeschlagen" >&2
          exit 1
