name: Dalton-Dashboard prüfen
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Getestete Abhängigkeiten installieren
        id: install
        run: npm ci --ignore-scripts
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --audit-level=high
      - name: Geordneten Gesamttest ausführen
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DALTON_TEST_REPORT: ${{ runner.temp }}/dalton-test-report.json
        run: npm test
      - name: Gesamttest-Bericht archivieren
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: dalton-test-report-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/dalton-test-report.json
          if-no-files-found: error
          retention-days: 14
