name: Dalton-Dashboard prüfen
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Getestete Abhängigkeiten installieren
        id: install
        run: npm ci --ignore-scripts
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --audit-level=high
      - name: Isolierte Redis-Testlaufzeit bereitstellen
        id: redis
        run: |
          if ! command -v redis-server || ! command -v redis-cli; then
            sudo apt-get update -qq -o Acquire::Retries=3 -o APT::Update::Error-Mode=any -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 redis-server redis-tools
          fi
          redis-server --version
          redis-cli --version
      - name: Geordneten Gesamttest ausführen
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.redis.outcome == 'success' }}
        env:
          DALTON_REQUIRE_LOCAL_REDIS: '1'
          DALTON_TEST_REPORT: ${{ runner.temp }}/dalton-test-report.json
        run: npm test
      - name: Gesamttest-Bericht archivieren
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.redis.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: dalton-test-report-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/dalton-test-report.json
          if-no-files-found: error
          retention-days: 14
