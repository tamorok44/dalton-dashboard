name: Dalton-Dashboard prüfen
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Getestete Abhängigkeiten installieren
        run: npm ci --ignore-scripts
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --audit-level=high
      - name: UI, Datenlogik und Architektur prüfen
        run: npm test
      # Temporary, one-time editorial capture on the draft branch. Removed after review.
      - name: Einmalige öffentliche Talentquellen-Prüfung
        if: matrix.node-version == '22' && github.event_name == 'pull_request' && github.head_ref == 'talent-planner-foundation-v1'
        timeout-minutes: 2
        run: node scripts/capture-talent-review-once.mjs
