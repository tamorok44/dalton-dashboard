name: Einmaliger Talent-Evidenzabgleich
on:
  push:
    branches: [talent-evidence-capture-20261126]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: talent-evidence-capture-20261126
          run-id: 45813547795
          github-token: ${{ github.token }}
          path: evidence-capture/
      - run: python scripts/inspect-current-talent-markup.py
