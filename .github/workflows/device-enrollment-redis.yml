name: Dalton Geräteberechtigungen Redis
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  device:
    name: Redis ${{ matrix.redis }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        redis: ["7", "8"]
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isolierte Redis-Geräteprüfung
        env:
          DALTON_TEST_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: node scripts/test-device-enrollment-redis.mjs
